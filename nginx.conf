# Static site for obmen.bx-shef.by.
# TLS terminates at the host-wide nginx-proxy; this server only sees plain http on :8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS proxy: a relative Location keeps redirects on https instead of
    # leaking http://host:8080 to the browser.
    absolute_redirect off;
    server_tokens off;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain application/xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

    # Inline <style> blocks and style="" attributes are used, so style-src needs
    # 'unsafe-inline'. Scripts are external files only — script-src stays 'self'.
    # Fonts: Google Fonts (CSS from fonts.googleapis.com, files from fonts.gstatic.com).
    # img-src data: — the favicon is an inline SVG data URI.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # add_header is NOT inherited by a location that declares its own add_header,
    # so the security set lives in one snippet-like block repeated per location.
    location = / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # File names are not content-hashed, so no `immutable`: a short max-age plus
    # revalidation lets a redeploy reach readers within an hour.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location /files/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
