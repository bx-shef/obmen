version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Must move together with playwright in print/requirements.txt (the
      # image's Chromium matches one Playwright release); bump both by hand.
      - dependency-name: "*playwright*"
