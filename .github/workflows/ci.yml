name: CI/CD

# Single pipeline so the deploy is gated on a green CI:
#   PR   → ci (link check + image build, no push)
#   main → ci → deploy (build + push to GHCR; Watchtower picks it up in ~5 min)
#
# The job name `ci` is the required status check for the main branch ruleset.
#
# Third-party actions are pinned to a full commit SHA: a mutable tag can be
# rewritten by the action owner. Dependabot keeps the SHAs current via the
# `# vX.Y.Z` comments.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every local href/src in the pages must point to a committed file.
      # Exception: files/*.pdf in site/ are rendered from print/ during the
      # Docker build; the smoke test below checks them in the built image.
      # Scope: href/src attributes in site/*.html and print/*.html (either quote
      # style), plus url() in print/fonts.css; srcset, other CSS and paths inside
      # JS are not checked. Paths resolve relative to the file that holds them.
      - name: Check local links
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pages=(site/*.html)
          if [ ${#pages[@]} -eq 0 ]; then
            echo "::error::no HTML pages found in site/"
            exit 1
          fi
          pages+=(print/*.html)
          fail=0
          for page in "${pages[@]}"; do
            dir=$(dirname "$page")
            # Drop ?query / #fragment; skip pure anchors and anything with a scheme.
            while IFS= read -r ref; do
              if [ "$dir" = site ] && [[ "$ref" == files/*.pdf ]]; then
                continue
              fi
              if [ ! -e "$dir/$ref" ]; then
                echo "::error file=$page::missing target: $ref"
                fail=1
              fi
            done < <(grep -oE "(href|src)=(\"[^\"]*\"|'[^']*')" "$page" \
                       | sed -E "s/^(href|src)=[\"']//; s/[\"']$//; s/[?#].*$//" \
                       | grep -vE '^$|^[A-Za-z][A-Za-z0-9+.-]*:|^//' \
                       | sort -u || true)
          done
          # The print pages load their fonts through CSS, not href/src.
          while IFS= read -r ref; do
            if [ ! -e "print/$ref" ]; then
              echo "::error file=print/fonts.css::missing target: $ref"
              fail=1
            fi
          done < <(grep -oE 'url\([^)]+\)' print/fonts.css \
                     | sed -E "s/^url\(//; s/\)$//; s/^[\"']//; s/[\"']$//" \
                     | sort -u || true)
          exit $fail

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Also runs `nginx -t` inside the Dockerfile. `load` keeps the image in the
      # local daemon for the smoke test below; nothing is pushed.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha,scope=runner
          tags: obmen:ci

      # `nginx -t` only proves the syntax. This catches what it cannot: a page or
      # rendered PDF answering 404, or a location that lost the security headers
      # (add_header is not inherited once a location declares its own).
      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name smoke -p 127.0.0.1:8080:8080 obmen:ci
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs smoke || true; docker stop smoke >/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 0.5
          done
          fail=0
          for path in / /index.html /plan.html; do
            headers=$(curl -fsSI "http://127.0.0.1:8080$path") || { echo "::error::$path is not 200"; fail=1; continue; }
            for h in Content-Security-Policy X-Content-Type-Options Referrer-Policy; do
              grep -qi "^$h:" <<<"$headers" || { echo "::error::$path lacks $h"; fail=1; }
            done
          done
          for f in site/assets/* site/robots.txt site/sitemap.xml; do
            path=${f#site}
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" || { echo "::error::$path is not 200"; fail=1; }
          done
          # PDFs rendered in the image's build stage (print/render.py). The list
          # comes from the pages' links, so a new or mistyped PDF link is caught
          # here (the link check skips files/*.pdf). Saved for the artifact below.
          mkdir -p pdf
          pdfs=$(grep -ohE "(href|src)=[\"']files/[^\"'?#]+\.pdf" site/*.html | sed -E "s/^(href|src)=[\"']//" | sort -u)
          [ -n "$pdfs" ] || { echo "::error::no PDF links found in site/*.html"; fail=1; }
          for ref in $pdfs; do
            path=/$ref
            type=$(curl -fsS -o "pdf/${ref##*/}" -w '%{content_type}' "http://127.0.0.1:8080$path") \
              || { echo "::error::$path is not 200"; fail=1; continue; }
            [ "$type" = application/pdf ] || { echo "::error::$path is $type, expected application/pdf"; fail=1; }
            head -c 5 "pdf/${ref##*/}" | grep -q '^%PDF-' || { echo "::error::$path is not a PDF file"; fail=1; }
            [ "$(stat -c %s "pdf/${ref##*/}")" -gt 10000 ] || { echo "::error::$path is suspiciously small"; fail=1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)
          [ "$code" = 404 ] || { echo "::error::unknown path returned $code, expected 404"; fail=1; }
          exit $fail

      # The PDFs are build output and no longer show up in the PR diff:
      # download them from the run's artifacts to review the rendered result.
      - name: Upload rendered PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf
          path: pdf/*.pdf
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Build & Push to GHCR
    needs: ci
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
