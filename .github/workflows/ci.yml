name: CI/CD

# Single pipeline so the deploy is gated on a green CI:
#   PR   → ci (link check + image build, no push)
#   main → ci → deploy (build + push to GHCR; Watchtower picks it up in ~5 min)
#
# The job name `ci` is the required status check for the main branch ruleset.
#
# Third-party actions are pinned to a full commit SHA: a mutable tag can be
# rewritten by the action owner. Dependabot keeps the SHAs current via the
# `# vX.Y.Z` comments.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every local href/src in the pages must point to a committed file.
      # Exception: files/*.pdf in site/ are rendered from print/ during the
      # Docker build; the smoke test below checks them in the built image.
      # Scope: href/src attributes in site/*.html and print/*.html (either quote
      # style), plus url() in print/fonts.css; srcset, other CSS and paths inside
      # JS are not checked. Paths resolve relative to the file that holds them.
      - name: Check local links
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pages=(site/*.html)
          if [ ${#pages[@]} -eq 0 ]; then
            echo "::error::no HTML pages found in site/"
            exit 1
          fi
          pages+=(print/*.html)
          fail=0
          for page in "${pages[@]}"; do
            dir=$(dirname "$page")
            # Drop ?query / #fragment; skip pure anchors and anything with a scheme.
            while IFS= read -r ref; do
              if [ "$dir" = site ] && [[ "$ref" == files/*.pdf ]]; then
                continue
              fi
              if [ ! -e "$dir/$ref" ]; then
                echo "::error file=$page::missing target: $ref"
                fail=1
              fi
            done < <(grep -oE "(href|src)=(\"[^\"]*\"|'[^']*')" "$page" \
                       | sed -E "s/^(href|src)=[\"']//; s/[\"']$//; s/[?#].*$//" \
                       | grep -vE '^$|^[A-Za-z][A-Za-z0-9+.-]*:|^//' \
                       | sort -u || true)
          done
          # The print pages load their fonts through CSS, not href/src.
          while IFS= read -r ref; do
            if [ ! -e "print/$ref" ]; then
              echo "::error file=print/fonts.css::missing target: $ref"
              fail=1
            fi
          done < <(grep -oE 'url\([^)]+\)' print/fonts.css \
                     | sed -E "s/^url\(//; s/\)$//; s/^[\"']//; s/[\"']$//" \
                     | sort -u || true)
          exit $fail

      # The Makefile runs on the server, where a broken one is found only when
      # it is needed. Targets are read from the rules themselves, so one left
      # out of .PHONY is still checked (and reported).
      - name: Check Makefile
        shell: bash
        run: |
          set -euo pipefail
          help=$(make help)
          echo "$help"
          phony=" $(sed -n 's/^\.PHONY://p' Makefile) "
          targets=$(grep -oE '^[A-Za-z0-9_][A-Za-z0-9_.-]*:' Makefile | tr -d : | sort -u)
          [ -n "$targets" ] || { echo "::error file=Makefile::no targets found"; exit 1; }
          fail=0
          for t in $targets; do
            [[ "$phony" == *" $t "* ]] || { echo "::error file=Makefile::$t is missing from .PHONY"; fail=1; }
            make -n "$t" >/dev/null || { echo "::error file=Makefile::make -n $t fails"; fail=1; }
            grep -qE "^  $t " <<<"$help" || { echo "::error file=Makefile::$t has no ## description"; fail=1; }
          done
          # REF must not be settable: make expands it before any shell runs,
          # so an overridable REF executes code even under -n.
          tmp=$(mktemp -d)
          make -n self-update compose-update "REF=\$(shell touch $tmp/pwned)" >/dev/null 2>&1 || true
          [ ! -e "$tmp/pwned" ] || { echo "::error file=Makefile::REF from the command line is expanded — use override"; fail=1; }
          rm -rf "$tmp"
          exit $fail

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Also runs `nginx -t` inside the Dockerfile. `load` keeps the image in the
      # local daemon for the smoke test below; nothing is pushed.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha,scope=runner
          tags: obmen:ci

      # `nginx -t` only proves the syntax. This catches what it cannot: a page or
      # rendered PDF answering 404, or a location that lost the security headers
      # (add_header is not inherited once a location declares its own).
      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name smoke -p 127.0.0.1:8080:8080 obmen:ci
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs smoke || true; docker stop smoke >/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 0.5
          done
          fail=0
          for path in / /index.html /plan.html; do
            headers=$(curl -fsSI "http://127.0.0.1:8080$path") || { echo "::error::$path is not 200"; fail=1; continue; }
            for h in Content-Security-Policy X-Content-Type-Options Referrer-Policy; do
              grep -qi "^$h:" <<<"$headers" || { echo "::error::$path lacks $h"; fail=1; }
            done
          done
          for f in site/assets/* site/robots.txt site/sitemap.xml; do
            path=${f#site}
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" || { echo "::error::$path is not 200"; fail=1; }
          done
          # PDFs rendered in the image's build stage (print/render.py). The list
          # comes from the pages' links, so a new or mistyped PDF link is caught
          # here (the link check skips files/*.pdf). Saved for the artifact below.
          mkdir -p pdf
          pdfs=$(grep -ohE "(href|src)=[\"']files/[^\"'?#]+\.pdf" site/*.html | sed -E "s/^(href|src)=[\"']//" | sort -u || true)
          [ -n "$pdfs" ] || { echo "::error::no PDF links found in site/*.html"; fail=1; }
          for ref in $pdfs; do
            path=/$ref
            type=$(curl -fsS -o "pdf/${ref##*/}" -w '%{content_type}' "http://127.0.0.1:8080$path") \
              || { echo "::error::$path is not 200"; fail=1; continue; }
            [ "$type" = application/pdf ] || { echo "::error::$path is $type, expected application/pdf"; fail=1; }
            head -c 5 "pdf/${ref##*/}" | grep -q '^%PDF-' || { echo "::error::$path is not a PDF file"; fail=1; }
            [ "$(stat -c %s "pdf/${ref##*/}")" -gt 10000 ] || { echo "::error::$path is suspiciously small"; fail=1; }
          done
          # Open Graph cards, also rendered at build time. og:image must be an
          # absolute URL on the canonical domain; fetch its path from this image.
          for page in site/*.html; do
            urls=$(grep -oE '<meta property="og:image" content="[^"]+"' "$page" | sed -E 's/.*content="//; s/"$//' || true)
            if [ "$(printf '%s' "$urls" | grep -c .)" != 1 ]; then
              echo "::error file=$page::expected exactly one og:image, found: '$urls'"; fail=1; continue
            fi
            path=/${urls#https://obmen.bx-shef.by/}
            # Also rejects another domain (the prefix is not stripped then) and ../
            if ! [[ "$path" =~ ^/files/[A-Za-z0-9_-]+\.png$ ]]; then
              echo "::error file=$page::og:image must be https://obmen.bx-shef.by/files/<name>.png: '$urls'"; fail=1; continue
            fi
            file=pdf/${path##*/}
            type=$(curl -fsS -o "$file" -w '%{content_type}' "http://127.0.0.1:8080$path") \
              || { echo "::error::$path is not 200"; fail=1; continue; }
            [ "$type" = image/png ] || { echo "::error::$path is $type, expected image/png"; fail=1; }
            size=$(python3 -c 'import struct,sys
          d = open(sys.argv[1], "rb").read(24)
          assert d[:8] == b"\x89PNG\r\n\x1a\n" and len(d) == 24
          print("%dx%d" % struct.unpack(">II", d[16:24]))' "$file" 2>/dev/null) \
              || { echo "::error::$path is not a valid PNG"; fail=1; continue; }
            [ "$size" = 1200x630 ] || { echo "::error::$path is $size, expected 1200x630"; fail=1; }
          done
          # Markdown for AI agents: each page's <link rel="alternate"> twin is served
          # as text/markdown, the page URL itself returns Markdown only when asked
          # for it in Accept, and every obmen link in /llms.txt resolves.
          for page in site/*.html; do
            twin=$(grep -oE '<link rel="alternate" type="text/markdown" href="[^"]+"' "$page" | sed -E 's/.*href="//; s/"$//' || true)
            [ -n "$twin" ] || { echo "::error file=$page::no <link rel=\"alternate\" type=\"text/markdown\">"; fail=1; continue; }
            url=/${page#site/}
            type=$(curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8080$twin") \
              || { echo "::error::$twin is not 200"; fail=1; continue; }
            [[ "$type" == text/markdown* ]] || { echo "::error::$twin is $type, expected text/markdown"; fail=1; }
            type=$(curl -fsS -o /dev/null -w '%{content_type}' -H 'Accept: text/markdown, */*' "http://127.0.0.1:8080$url")
            [[ "$type" == text/markdown* ]] || { echo "::error::$url with Accept: text/markdown is $type"; fail=1; }
            type=$(curl -fsS -o /dev/null -w '%{content_type}' -H 'Accept: text/html,*/*;q=0.8' "http://127.0.0.1:8080$url")
            [[ "$type" == text/html* ]] || { echo "::error::$url for a browser is $type"; fail=1; }
          done
          llms=$(curl -fsS http://127.0.0.1:8080/llms.txt) || { echo "::error::/llms.txt is not 200"; fail=1; llms=""; }
          head -1 <<<"$llms" | grep -q '^# ' || { echo "::error::/llms.txt must start with an H1"; fail=1; }
          for path in $(grep -oE 'https://obmen\.bx-shef\.by/[^) ]*' <<<"$llms" | sed 's#https://obmen.bx-shef.by##' | sort -u || true); do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" || { echo "::error::/llms.txt links $path, which is not 200"; fail=1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)
          [ "$code" = 404 ] || { echo "::error::unknown path returned $code, expected 404"; fail=1; }
          exit $fail

      # The PDFs and OG cards are build output and do not show up in the PR
      # diff: download them from the run's artifacts to review the result.
      - name: Upload rendered PDFs and OG cards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered
          path: |
            pdf/*.pdf
            pdf/*.png
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Build & Push to GHCR
    needs: ci
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
